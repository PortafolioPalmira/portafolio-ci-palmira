<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capacidades Científicas — C.I. Palmira</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f2ed;
    --surface: #ffffff;
    --border: #e0d9d0;
    --text: #1c1a17;
    --text-2: #5a5650;
    --text-3: #8a857d;
    --green: #1d5c3a;
    --green-light: #e8f2ec;
    --amber: #b5651d;
    --amber-light: #fdf3e7;
    --teal: #1d4d5c;
    --teal-light: #e7f2f5;
    --gold: #8a6e1a;
    --gold-light: #faf3dc;
    --radius: 12px;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --shadow-hover: 0 8px 32px rgba(0,0,0,0.14);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 20px 80px;
  }

  /* ── HEADER ── */
  .page-header {
    max-width: 960px;
    margin: 0 auto 48px;
    border-bottom: 2px solid var(--border);
    padding-bottom: 28px;
  }
  .page-header .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: 8px;
  }
  .page-header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 38px;
    line-height: 1.15;
    color: var(--text);
    margin-bottom: 12px;
  }
  .page-header p {
    font-size: 15px;
    color: var(--text-2);
    max-width: 600px;
    line-height: 1.6;
  }

  /* ── LEGEND ── */
  .legend {
    max-width: 960px;
    margin: 0 auto 32px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-2);
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── FILTER TABS ── */
  .filter-bar {
    max-width: 960px;
    margin: 0 auto 28px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 7px 18px;
    border-radius: 99px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-2);
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .filter-btn:hover { border-color: var(--green); color: var(--green); }
  .filter-btn.active {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }

  /* ── GRID ── */
  .caps-grid {
    max-width: 960px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  /* ── CARD ── */
  .cap-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px 20px;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  .cap-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .cap-card.emergente::before  { background: var(--amber); }
  .cap-card.consolidada::before { background: var(--teal); }
  .cap-card.distintiva::before  { background: var(--gold); }

  .cap-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-hover);
    border-color: #c5bdb2;
  }
  .cap-card.hidden { display: none; }

  .cap-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .cap-card.emergente  .cap-badge { background: var(--amber-light); color: var(--amber); }
  .cap-card.consolidada .cap-badge { background: var(--teal-light); color: var(--teal); }
  .cap-card.distintiva  .cap-badge { background: var(--gold-light); color: var(--gold); }

  .cap-name {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--text);
    margin-bottom: 14px;
  }

  .cap-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
  }
  .cap-count {
    font-size: 12px;
    color: var(--text-3);
  }
  .cap-count strong {
    font-weight: 600;
    color: var(--text-2);
  }
  .cap-arrow {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    color: var(--text-3);
    transition: background 0.18s, color 0.18s;
  }
  .cap-card:hover .cap-arrow {
    background: var(--green);
    color: #fff;
  }

  /* ── MODAL OVERLAY ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(28, 26, 23, 0.55);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  /* ── MODAL BOX ── */
  .modal {
    background: var(--surface);
    border-radius: 16px;
    width: 100%;
    max-width: 720px;
    max-height: 85vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 24px 80px rgba(0,0,0,0.22);
    transform: translateY(20px) scale(0.98);
    transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
  }
  .modal-overlay.open .modal {
    transform: translateY(0) scale(1);
  }

  .modal-header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    position: relative;
  }
  .modal-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .modal-badge.emergente  { background: var(--amber-light); color: var(--amber); }
  .modal-badge.consolidada { background: var(--teal-light); color: var(--teal); }
  .modal-badge.distintiva  { background: var(--gold-light); color: var(--gold); }

  .modal-title {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    line-height: 1.3;
    color: var(--text);
    padding-right: 40px;
  }
  .modal-subtitle {
    font-size: 13px;
    color: var(--text-3);
    margin-top: 6px;
  }
  .modal-close {
    position: absolute;
    top: 24px; right: 28px;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--bg);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    color: var(--text-2);
    transition: background 0.18s;
  }
  .modal-close:hover { background: var(--border); }

  .modal-body {
    overflow-y: auto;
    padding: 24px 32px 32px;
    flex: 1;
  }

  /* ── PROJECT ACCORDION ── */
  .project-item {
    border: 1.5px solid var(--border);
    border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .project-header {
    padding: 16px 20px;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    background: var(--surface);
    transition: background 0.15s;
  }
  .project-header:hover { background: var(--bg); }

  .project-header-left { flex: 1; }
  .project-sistema {
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--green);
    margin-bottom: 4px;
  }
  .project-nombre {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--text);
  }
  .project-lider {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 3px;
  }

  .project-estado {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }
  .estado-pill {
    padding: 2px 9px;
    border-radius: 99px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .estado-pill.activo     { background: #e8f5e9; color: #2e7d32; }
  .estado-pill.finalizado { background: #f3f4f6; color: #555; }
  .estado-pill.ejecucion  { background: #e3f2fd; color: #1565c0; }
  .estado-pill.formulacion { background: #fff3e0; color: #e65100; }

  .chevron {
    width: 20px; height: 20px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    color: var(--text-3);
    font-size: 11px;
    transition: transform 0.2s ease, background 0.15s;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .project-item.expanded .chevron {
    transform: rotate(180deg);
    background: var(--green);
    color: #fff;
  }

  .project-details {
    display: none;
    padding: 0 20px 20px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  .project-item.expanded .project-details { display: block; }

  .detail-section {
    margin-top: 16px;
  }
  .detail-label {
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-3);
    margin-bottom: 6px;
  }
  .detail-value {
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--text);
    white-space: pre-wrap;
  }

  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
  }
  .trl-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--green-light);
    color: var(--green);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
  }

  /* ── EMPTY ── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-3);
    font-size: 14px;
  }

  /* ── SCROLL ── */
  .modal-body::-webkit-scrollbar { width: 6px; }
  .modal-body::-webkit-scrollbar-track { background: transparent; }
  .modal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 600px) {
    .page-header h1 { font-size: 28px; }
    .modal { max-height: 92vh; }
    .modal-header { padding: 22px 20px 16px; }
    .modal-body { padding: 16px 20px 24px; }
    .detail-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="page-header">
  <div class="eyebrow">AGROSAVIA · C.I. Palmira</div>
  <h1>Capacidades Científicas</h1>
  <p>Haz clic en cualquier capacidad para explorar los proyectos de I+D+i que la respaldan, incluyendo objetivos y productos generados.</p>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#b5651d"></div> Emergente</div>

  <div class="legend-item"><div class="legend-dot" style="background:#8a6e1a"></div> Distintiva</div>
</div>

<div class="filter-bar">

</div>

<div class="caps-grid" id="capsGrid"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true">

    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

// ── Build grid ──
function buildGrid() {
  const grid = document.getElementById('capsGrid');
  grid.innerHTML = '';
  Object.entries(CAP_DATA).forEach(([name, info]) => {
    const count = info.proyectos.length;
    const tipo = info.tipo;
    const card = document.createElement('div');
    card.className = `cap-card ${tipo}`;
    card.dataset.tipo = tipo;
    card.dataset.cap = name;
    card.innerHTML = `
      <div class="cap-badge">${capitalize(tipo)}</div>
      <div class="cap-name">${escHtml(name)}</div>
      <div class="cap-footer">
        <div class="cap-count"><strong>${count}</strong> proyecto${count !== 1 ? 's' : ''}</div>
        <div class="cap-arrow">→</div>
      </div>`;
    card.addEventListener('click', () => openModal(name, info));
    grid.appendChild(card);
  });
}

// ── Filter ──
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filter = btn.dataset.filter;
    document.querySelectorAll('.cap-card').forEach(card => {
      if (filter === 'all' || card.dataset.tipo === filter) {
        card.classList.remove('hidden');
      } else {
        card.classList.add('hidden');
      }
    });
  });
});

// ── Modal ──
function openModal(name, info) {
  const overlay = document.getElementById('modalOverlay');
  const tipo = info.tipo;
  document.getElementById('modalBadge').textContent = capitalize(tipo);
  document.getElementById('modalBadge').className = `modal-badge ${tipo}`;
  document.getElementById('modalTitle').textContent = name;
  document.getElementById('modalSubtitle').textContent = `${info.proyectos.length} proyecto${info.proyectos.length !== 1 ? 's' : ''} con respaldo técnico-científico`;

  const body = document.getElementById('modalBody');
  if (info.proyectos.length === 0) {
    body.innerHTML = '<div class="empty-state">No hay proyectos registrados para esta capacidad.</div>';
  } else {
    body.innerHTML = info.proyectos.map((p, i) => buildProjectItem(p, i)).join('');
    body.querySelectorAll('.project-header').forEach(h => {
      h.addEventListener('click', () => {
        const item = h.closest('.project-item');
        item.classList.toggle('expanded');
      });
    });
  }

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function buildProjectItem(p, idx) {
  const estadoClass = getEstadoClass(p.estado);
  const trlHtml = (p.trl_ini && p.trl_fin && p.trl_fin !== 'No definido')
    ? `<div class="trl-badge">TRL ${p.trl_ini} → ${p.trl_fin}</div>`
    : '';
  const objHtml = p.objetivo
    ? `<div class="detail-section"><div class="detail-label">Objetivo</div><div class="detail-value">${escHtml(p.objetivo)}</div></div>`
    : '';
  const prodHtml = p.productos
    ? `<div class="detail-section"><div class="detail-label">Productos generados</div><div class="detail-value">${escHtml(p.productos)}</div></div>`
    : '';
  const resHtml = p.resultados
    ? `<div class="detail-section"><div class="detail-label">Resultados principales</div><div class="detail-value">${escHtml(p.resultados)}</div></div>`
    : '';
  return `
    <div class="project-item" id="proj_${idx}">
      <div class="project-header">
        <div class="project-header-left">
          <div class="project-sistema">${escHtml(p.sistema)} · ${escHtml(p.area)}</div>
          <div class="project-nombre">${escHtml(p.nombre)}</div>
          <div class="project-lider">👤 ${escHtml(p.lider)}</div>
        </div>
        <div class="project-estado">
          ${p.estado ? `<span class="estado-pill ${estadoClass}">${escHtml(p.estado)}</span>` : ''}
          ${trlHtml}
          <div class="chevron">▾</div>
        </div>
      </div>
      <div class="project-details">
        ${objHtml}${prodHtml}${resHtml}
        <div class="detail-grid">
          ${p.programa ? `<div class="detail-section"><div class="detail-label">Programa</div><div class="detail-value" style="font-size:12.5px">${escHtml(p.programa)}</div></div>` : ''}
        </div>
      </div>
    </div>`;
}

function getEstadoClass(estado) {
  const s = (estado || '').toLowerCase();
  if (s.includes('ejecución') || s.includes('ejecucion')) return 'ejecucion';
  if (s.includes('finaliz')) return 'finalizado';
  if (s.includes('formulac')) return 'formulacion';
  return 'activo';
}

function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

buildGrid();
</script>
